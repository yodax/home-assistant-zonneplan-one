fetch_statistics:
  name: Fetch history from Zonneplan API
  description: Refetch statistics from a given date until now, repairing any gaps or incorrect historical values.
  fields:
    endpoint:
      name: Endpoint
      description: The data endpoint to refetch statistics for.
      required: true
      selector:
        select:
          options:
            - electricity
            - gas
      example: "electricity"
    start_date:
      name: Start date
      description: "The date to start refetching from. Accepted formats: YYYYMMDD or YYYY-MM-DD."
      required: true
      example: "2025-01-01"
      selector:
        text:
    connection_uuid:
      name: Connection UUID
      description: "Optionally limit the refetch to a specific connection UUID. If omitted, all matching connections are updated (see last part of statistics_id: `zonneplan_one:electricity_delivered_xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx`)."
      required: false
      selector:
        text:


fetch_cost_statistics:
  name: Fetch actual cost history from Zonneplan API
  description: >-
    Backfill the daily actual electricity cost statistics (delivery/production/net, incl. and excl. tax)
    and Powerplay earnings (EUR) from a start date until today. Runs in the background (one API call per
    day, paced) and is resumable: without start_date it continues from the last stored day (first run
    starts 2025-08-01). Re-importing days is idempotent.
  fields:
    start_date:
      name: Start date
      description: "First day to (re)import. Accepted formats: YYYYMMDD or YYYY-MM-DD. Omit to resume."
      required: false
      example: "2025-08-01"
      selector:
        text:
    endpoint:
      name: Endpoint
      description: Which statistics to backfill.
      required: false
      default: all
      selector:
        select:
          options:
            - all
            - electricity
            - battery
    connection_uuid:
      name: Connection UUID
      description: Optionally limit to one connection UUID.
      required: false
      selector:
        text:
